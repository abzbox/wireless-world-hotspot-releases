name: Publish APK release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        run: |
          set -euo pipefail
          cat staging/apk-part-* | tr -d '\n' | base64 -d > WirelessWorldHotspot.apk
          echo "4ab00504ac8022c87515b88de4a1cb11096a0fcdc5009269a592643fdeeaaff9  WirelessWorldHotspot.apk" | sha256sum -c -
          test "$(wc -c < WirelessWorldHotspot.apk)" -eq 1872451
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.4 WirelessWorldHotspot.apk \
            --title "Wireless World Hotspot v1.0.4" \
            --notes "Public download of Wireless World Hotspot for Android (v1.0.4, versionCode 5). This APK contains no secrets. Upgrade over v1.0.3 with the same signing key. On your phone, open the APK and allow install from this source if Android asks."
      - name: Remove temporary staging files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r staging
          git commit -m "Remove temporary staging after v1.0.4 release"
          git push
